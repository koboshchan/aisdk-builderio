name: Build GitHub package

on:
  push:
    branches: [main, 'kat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: npm install --package-lock=false
      - run: npm run typecheck && npm test && npm run build
      - name: Stage installable package
        run: node scripts/prepare-dist.mjs "$RUNNER_TEMP/package"
      - name: Verify staged package
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          echo '{"private":true}' > package.json
          archive=$(npm pack "$RUNNER_TEMP/package" --pack-destination "$RUNNER_TEMP" --silent)
          bun add "$RUNNER_TEMP/$archive"
          bun -e 'import {createBuilder} from "ai-sdk-provider-builder"; if(typeof createBuilder !== "function") throw new Error("Missing export")'
          node --input-type=module -e 'import {createBuilder} from "ai-sdk-provider-builder"; if(typeof createBuilder !== "function") throw new Error("Missing ESM export")'
          node -e 'if(typeof require("ai-sdk-provider-builder").createBuilder !== "function") throw new Error("Missing CJS export")'
      - name: Publish dist branch
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package
        run: |
          git config user.name koboshchan
          git config user.email 91501777+koboshchan@users.noreply.github.com
          if git ls-remote --exit-code --heads origin dist; then
            git fetch origin dist
            git worktree add "$RUNNER_TEMP/dist-branch" -B dist FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/dist-branch"
            git -C "$RUNNER_TEMP/dist-branch" checkout --orphan dist
          fi
          cd "$RUNNER_TEMP/dist-branch"
          git rm -rf --ignore-unmatch .
          cp -R "$PACKAGE_DIR/." .
          git add -f package.json README.md dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build package from ${GITHUB_SHA}"
          git push origin HEAD:dist
      - name: Verify GitHub installation
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir "$RUNNER_TEMP/github-smoke"
          cd "$RUNNER_TEMP/github-smoke"
          echo '{"private":true}' > package.json
          BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-cache" bun add github:koboshchan/aisdk-builderio#dist
          bun -e 'import {createBuilder} from "ai-sdk-provider-builder"; if(typeof createBuilder !== "function") throw new Error("Missing export")'
